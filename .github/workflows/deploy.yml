name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    needs: []  # CI already passed on this commit via branch protection
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}/spendwise-api:latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}/spendwise-frontend:latest
          build-args: |
            CACHEBUST=${{ github.sha }}

      - name: Sync docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 51.91.18.120
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /home/deploy/spendwise/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 51.91.18.120
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/spendwise
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
            echo "Deploy complete: $(date)"