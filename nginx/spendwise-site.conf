server {
    listen 80;
    server_name finance.lalonhobekotodine.sbs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name finance.lalonhobekotodine.sbs;

    ssl_certificate     /etc/letsencrypt/live/finance.lalonhobekotodine.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.lalonhobekotodine.sbs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # WebSocket endpoint (must come before /api/)
    location /api/v1/ws {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend SPA
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
